name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Ubuntu, e não Windows: o desenvolvimento é em Windows, então a CI cobre a
    # plataforma onde o projeto provavelmente será avaliado — incluindo as
    # diferenças de line ending que os testes golden dependem.
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # requires-python declara ">=3.12" como contrato público, mas o runtime
        # local é 3.13. Sem testar o piso, uso acidental de API exclusiva do 3.13
        # só apareceria na máquina do avaliador.
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      - name: Test
        run: pytest
